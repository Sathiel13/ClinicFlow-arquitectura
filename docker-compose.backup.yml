services:

  n8n:
    image: n8nio/n8n:latest
    container_name: clinicflow-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_VERSION_NOTIFICATIONS_ENABLED=${N8N_VERSION_NOTIFICATIONS_ENABLED}
      - N8N_TEMPLATES_ENABLED=${N8N_TEMPLATES_ENABLED}
      - CF_WHATSAPP_VERIFY_TOKEN=${CF_WHATSAPP_VERIFY_TOKEN}
      - CF_SUPABASE_URL=${CF_SUPABASE_URL}
      - CF_SUPABASE_SERVICE_KEY=${CF_SUPABASE_SERVICE_KEY}
      - CF_SUPABASE_DB_URL=${CF_SUPABASE_DB_URL}
      - CF_META_ACCESS_TOKEN=${CF_META_ACCESS_TOKEN}
      - CF_META_PHONE_NUMBER_ID=${CF_META_PHONE_NUMBER_ID}
      - CF_META_BUSINESS_ACCOUNT_ID=${CF_META_BUSINESS_ACCOUNT_ID}
      - CF_EVO_BASE_URL=${CF_EVO_BASE_URL}
      - CF_EVO_API_KEY=${CF_EVO_API_KEY}
      - CF_EVO_INSTANCE=${CF_EVO_INSTANCE}
      - CF_EVO_SERVER_URL=${CF_EVO_SERVER_URL}   
      - CF_CALCOM_API_KEY=${CF_CALCOM_API_KEY}   
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - clinicflow_net

  postgres:
    image: postgres:16
    container_name: clinicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVO_DB_NAME}
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${EVO_DB_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVO_DB_USER} -d ${EVO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - clinicflow_net

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: clinicflow-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${CF_EVO_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${EVO_DB_USER}:${EVO_DB_PASSWORD}@postgres:5432/${EVO_DB_NAME}?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange

      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "false"

      CONFIG_SESSION_PHONE_CLIENT: "ClinicFlow"
      CONFIG_SESSION_PHONE_NAME: "Chrome"

      DEL_INSTANCE: "false"
      DEL_TEMP_INSTANCES: "false"

      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"

      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: ""

      LOG_LEVEL: INFO
      LOG_BAILEYS: debug
      LOG_COLOR: "true"

      TZ: ${TZ}

    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_store:/evolution/store
    networks:
      - clinicflow_net

networks:
  clinicflow_net:
    driver: bridge